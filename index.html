<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario y Reportes</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fc;--card:#fff;--tx:#1b1f24;--mu:#5b6677;--ac:#1d4ed8;--acx:#fff;--bd:#d9e0ea;--dg:#b42318;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--tx:#e6e8ec;--mu:#9aa3af;--ac:#60a5fa;--acx:#08121f;--bd:#2a2f38;--dg:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--tx:#e6e8ec;--mu:#9aa3af;--ac:#60a5fa;--acx:#08121f;--bd:#2a2f38;--dg:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:14px 18px;min-height:50px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--dg)}button.s{padding:10px 14px;min-height:42px;font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px}label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:18px 4px;background:none;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--bd)}.kv b{font-weight:600;text-align:right}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:9px 14px;margin:0 8px 8px 0;font-size:14px;background:var(--card);cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;display:none;max-width:90%}
.ver{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4px);right:8px;font-size:11px;color:var(--mu);opacity:.7;pointer-events:none;z-index:5}
.upi .card b,.upi .kv,.upi h1,.upi .chip,.upi input:not([type=file]),.upi textarea,.upi option{text-transform:uppercase}
.upr .card,.upr input:not([type=file]),.upr textarea{text-transform:uppercase}
img.ph{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px}
</style></head><body>
<div class="ver" id="ver"></div><main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const VERSION="1.8.0";
const GUIDE=[
["Inventarios","Aquí llevas el control de lo que hay. Todo se organiza así: grupo (una sede) → lista (computadoras, toners…) → registros (cada equipo o artículo)."],
["Grupos (sedes) y colores","Crea un grupo por sede (CDA, CDB). Al crearlo escoges su color y, si quieres, copias las listas de otro grupo para no armarlas de nuevo. Con «Renombrar / color» lo cambias después."],
["Listas y campos","Dentro de un grupo toca «+ Nueva lista», ponle nombre y define los campos que vas a anotar: Texto, Número, Opciones (tú escribes las opciones) o Cantidad (stock). Con «Editar campos» los cambias cuando quieras."],
["Atajos","Son listas de campos ya listas (Computadoras, Teléfonos, Toner). Los editas, borras o creas en Ajustes → Mis atajos, o con «Guardar estos campos como atajo» al crear una lista."],
["Registros","Dentro de una lista toca «+ Agregar» por cada equipo o artículo. «Guardar y otro» sirve para cargar varios seguidos."],
["Mover entre listas y sedes","Cada registro tiene el botón «Mover»: escoges la sede y la lista destino (por ejemplo, de «PC en uso» a «PC dañadas», o de CDA a CDB). Los campos que falten en la lista destino se agregan solos. Si la lista tiene un campo Cantidad (stock), dices cuántos pasan: se resta en el origen y se suma en el destino. Todo queda en «Movimientos entre sedes»."],
["Cantidad rápida y poco stock","En las listas con campo Cantidad, usa − y + para ajustar de uno en uno, o toca el número para escribir otro valor o sumar/restar 5. Al agregar o editar un registro puedes poner «Avisar cuando queden» (mínimo, por artículo): si la cantidad llega a ese número o baja de él, el registro se marca en rojo y sale un aviso arriba en Inventarios."],
["Ordenar y recordar","En cada lista, «Ordenar» te deja escoger el campo (nombre, modelo, ubicación…) y la dirección A→Z o Z→A. Al escribir en un campo de texto, la app te sugiere lo que ya has puesto antes. Al crear o editar campos, usa las flechas ↑ ↓ para cambiar su posición."],
["Mayúsculas","En Ajustes → Apariencia puedes activar o desactivar las mayúsculas en inventarios y en reportes."],
["Borrar con seguridad","Borrar una lista o un grupo pide dos verificaciones: primero confirmas, y luego tienes que escribir BORRAR."],
["Excel","En cada lista, «⬇ Excel» baja esa lista. Dentro de un grupo, «⬇ Excel del grupo» baja un solo archivo con una hoja por cada lista. Y con «⬇ Excel de varias listas», en la pantalla de Inventarios, marcas las listas que quieras (de cualquier sede) y las bajas juntas en un mismo archivo, una hoja por lista. Hay que haber abierto la app con internet al menos una vez."],
["Reportes","En la pestaña Reportes escoges el tipo y pones equipo y descripción. Con «📷 Tomar foto» abres la cámara directo, y con «🖼 Galería» eliges fotos que ya tienes. Puedes poner hasta 5 fotos por reporte. «Compartir por WhatsApp» abre el menú del teléfono con todo listo; «Copiar texto» es el respaldo si las fotos no se adjuntan. Los tipos de reporte los manejas en Ajustes."],
["Fotos y espacio","Las fotos se reducen solas para que pesen poco, pero el espacio del navegador es limitado (unas 30 fotos en total). En Ajustes → Fotos de reportes ves cuánto ocupan y puedes borrar las de reportes viejos: el texto del reporte se queda y solo se quita la foto."],
["Historial y filtro","Los reportes guardados quedan en el Historial. El selector de arriba filtra por tipo y muestra cuántos hay de cada uno."],
["Respaldos","En Ajustes hay dos: «Respaldo sin fotos» (liviano, es el de la rutina semanal) y «Respaldo completo» (con las fotos, pesa más). La app te recuerda hacer el sin fotos los viernes (o si pasaron 7 días). Para cargarlo en otro equipo: «Combinar» agrega lo que falte sin borrar nada; «Reemplazar» deja el equipo igual al respaldo."],
["Pasar plantillas a otro equipo","«Descargar plantillas» o «Copiar código» pasa tus grupos, listas, atajos y tipos de reporte (sin registros) a otro equipo."],
["Dónde se guardan los datos","Viven en el navegador de este equipo, no en internet. Por eso cada equipo guarda lo suyo y el respaldo es tu seguro. Si se borran los datos de Chrome, se pierden."],
["Apariencia y versión","En Ajustes escoges Oscuro, Claro o Automático. El número de versión sale en la esquina: si subes cambios y ese número cambia, ya cargó la actualización."]
];
const LOG=[["1.8.0","Excel de varias listas en un solo archivo"],["1.7.0","Mover entre listas y sedes, orden, alerta de poco stock, sugerencias, flechas, mayúsculas y borrado con doble verificación"],["1.6.0","Botón de cámara, varias fotos por reporte, borrar fotos viejas y respaldo sin fotos"],["1.5.0","Guía de uso y movimientos de cantidades entre sedes"],["1.4.0","Tema oscuro grafito, colores por sede, botones más grandes y Excel azul"],["1.3.1","Confirmaciones dentro de la app (arregla borrar) y Excel con diseño"],["1.3.0","Grupos (sedes), atajos editables y Excel por grupo"],["1.2.2","Se muestra la versión en la esquina"],["1.2.1","Corrección para que las actualizaciones se carguen"],["1.2.0","Filtro de reportes por tipo"],["1.1.0","Combinar respaldos y recordatorio semanal"],["1.0.0","Inventarios, reportes y exportar a Excel"]];
const KEY="invrep_v1";
const DEF={tpls:[],recs:{},rtypes:["Error de sistema de facturación","Error de caja","Falla de equipo","Otro"],reps:[],groups:[],presets:null,moves:[],upInv:true,upRep:false,theme:"dark",lastBackup:"",snooze:""};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
S=Object.assign(JSON.parse(JSON.stringify(DEF)),S||{});
let V={grp:null,filter:"",tab:"inv",tpl:null,modal:null,draft:{type:"",photos:[],desc:"",equipo:""}};
const $=s=>document.querySelector(s);
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast("No hay espacio para guardar. Borra fotos viejas en Ajustes");return false}}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
const PRESETS={"Computadoras":["Nombre","Marca","Procesador","RAM","Almacenamiento","Ubicación"],"Teléfonos":["Nombre","Marca","Modelo","RAM","Almacenamiento","Número"],"Toner":["Marca","Compatibilidad","Color","Cantidad"]};
if(!Array.isArray(S.presets))S.presets=Object.keys(PRESETS).map(k=>({id:"p_"+k,name:k,fields:PRESETS[k].map(n=>({n,t:n==="Cantidad"?"qty":"text",o:""}))}));
S.presets.forEach(p=>{if(p.id==="p_Toner")p.fields.forEach(f=>{if(f.n==="Cantidad"&&f.t==="text")f.t="qty"})});

function dl(filename,data){
  const u=URL.createObjectURL(data),a=document.createElement("a");
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Descargando "+filename);
}
async function xl(lists,filename,lbl){
  if(!window.ExcelJS){
    if(lists.length===1){const csv="\ufeff"+aoaOf(lists[0]).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");dl(filename.replace(/\.xlsx$/,".csv"),new Blob([csv],{type:"text/csv"}))}
    else toast("El Excel con diseño no está disponible ahora; abre la app con internet una vez");
    return}
  const wb=new ExcelJS.Workbook(),used=new Set(),bd={style:"thin",color:{argb:"FFBFC5CC"}};
  lists.forEach(t=>{
    const A=aoaOf(t),gg=S.groups.find(g=>g.id===t.gid),ws=wb.addWorksheet(sheetName(lbl?lbl(t):t.name,used),{views:[{state:"frozen",ySplit:1}],properties:gg&&gg.color?{tabColor:{argb:"FF"+gg.color.slice(1)}}:{}});
    ws.addRows(A);
    A[0].forEach((_,i)=>{ws.getColumn(i+1).width=Math.min(45,Math.max(12,...A.map(r=>String(r[i]??"").length+3)))});
    ws.autoFilter={from:{row:1,column:1},to:{row:1,column:A[0].length}};
    ws.getRow(1).height=24;
    ws.eachRow((row,n)=>row.eachCell(c=>{
      c.border={top:bd,left:bd,bottom:bd,right:bd};
      c.alignment={vertical:"middle",wrapText:true};
      if(n===1){c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1F4E79"}};c.alignment={vertical:"middle",horizontal:"center",wrapText:true}}
      else if(n%2===1)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEAF1F8"}};
    }));
  });
  try{dl(filename,new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}catch(e){toast("No se pudo crear el Excel")}
}
const exportXlsx=t=>xl([t],gname(t)+t.name+".xlsx");

const ymd=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function due(){
  if(!S.tpls.length&&!S.reps.length)return false;
  const t=ymd();if(S.snooze===t)return false;if(!S.lastBackup)return true;
  const days=(new Date(t+"T00:00:00")-new Date(S.lastBackup+"T00:00:00"))/864e5;
  return days>=7||(new Date().getDay()===5&&S.lastBackup!==t);
}
const ph=r=>r.photos||(r.photo?[r.photo]:[]);
const thumbs=(a,rm)=>a.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${a.map((u,i)=>`<span style="position:relative"><img src="${u}" style="height:90px;border-radius:10px;display:block">${rm?`<span data-a="rmph" data-i="${i}" style="position:absolute;top:-6px;right:-6px;background:var(--dg);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;cursor:pointer">✕</span>`:""}</span>`).join("")}</div>`:"";
function repTime(r){if(r.ts)return r.ts;const m=/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(r.date||"");if(!m)return null;const y=+m[3]<100?2000+ +m[3]:+m[3];return new Date(y,+m[2]-1,+m[1]).getTime()}
function photoStats(){let n=0,b=0;S.reps.forEach(r=>ph(r).forEach(u=>{n++;b+=u.length*.75}));return{n,mb:(b/1048576).toFixed(1)}}
function banner(){return due()?`<div class="card" style="border-color:var(--ac)"><b>💾 ¿Hacemos el respaldo semanal?</b><div class="mu" style="margin:4px 0 10px">${S.lastBackup?"Último respaldo: "+S.lastBackup:"Todavía no has hecho ningún respaldo."}</div><div class="row"><button class="p" data-a="bkp">Respaldo sin fotos</button><button data-a="snooze">Más tarde</button></div></div>`:""}
function doBackup(withPhotos){const D=withPhotos?S:{...S,reps:S.reps.map(r=>({...r,photo:undefined,photos:[],fotosBorradas:(r.fotosBorradas||0)+ph(r).length}))};dl("respaldo-"+(withPhotos?"completo-":"")+ymd()+".json",new Blob([JSON.stringify({app:"invrep",...D,lastBackup:ymd()})],{type:"application/json"}));S.lastBackup=ymd();save()}
function render(){
  const _sh=$(".sheet"),_st=_sh?_sh.scrollTop:0;
  $("#nav").innerHTML=[["inv","📦 Inventarios"],["rep","📝 Reportes"],["cfg","⚙️ Ajustes"]].map(([k,l])=>`<button class="${V.tab===k?"on":""}" data-a="tab" data-k="${k}">${l}</button>`).join("");
  $("#app").className=(V.tab==="inv"&&S.upInv?"upi":"")+(V.tab==="rep"&&S.upRep?" upr":"");
  $("#app").innerHTML=banner()+(V.tab==="inv"?lowBanner():"")+(V.tab==="inv"?vInv():V.tab==="rep"?vRep():vCfg())+(V.modal?vModal():"");
  const _n=$(".sheet");if(_n&&_st)_n.scrollTop=_st;
}
function applyTheme(){const t=S.theme||"dark",r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t)}
const ask=(msg,fn,word)=>{V.modal={k:"cf",msg,fn,word,typed:""}};
const nm=x=>String(x??"").trim().toLowerCase();
const U=x=>S.upInv?String(x??"").toUpperCase():String(x??"");
const itemDesc=(t,r)=>t.fields.filter(f=>f.t!=="qty").map(f=>r[f.id]).filter(Boolean).join(" · ");
function sugg(fn){const k=nm(fn),set=new Set();S.tpls.forEach(t=>t.fields.forEach(f=>{if(f.t==="text"&&nm(f.n)===k)(S.recs[t.id]||[]).forEach(r=>{const v=String(r[f.id]||"").trim();if(v)set.add(v)})}));return[...set].sort((a,b)=>a.localeCompare(b,"es"))}
function lows(){const o=[];S.tpls.forEach(t=>{const q=t.fields.find(f=>f.t==="qty");if(!q)return;(S.recs[t.id]||[]).forEach(r=>{const m=parseFloat(r._min),n=parseFloat(r[q.id])||0;if(!isNaN(m)&&n<=m)o.push({t,r,n})})});return o}
function lowBanner(){const L=lows();if(!L.length)return"";return `<div class="card" style="border-color:var(--dg)"><b style="color:var(--dg)">⚠ Poco stock (${L.length})</b>${L.slice(0,6).map(x=>`<div class="kv"><span>${h(itemDesc(x.t,x.r)||x.t.name)} <span class="mu">· ${h(gnm(x.t.gid))}</span></span><b>quedan ${x.n}</b></div>`).join("")}${L.length>6?`<div class="mu">y ${L.length-6} más…</div>`:""}</div>`}
function sortRows(t,rows){const f=t.sortF&&t.fields.find(x=>x.id===t.sortF);if(!f)return rows;const num=f.t==="number"||f.t==="qty",d=t.sortD==="desc"?-1:1;return rows.slice().sort((a,b)=>{const x=a[f.id]??"",y=b[f.id]??"";return d*(num?(parseFloat(x)||0)-(parseFloat(y)||0):String(x).localeCompare(String(y),"es",{numeric:true,sensitivity:"base"}))})}
function mvInfo(m){const tt=S.tpls.find(x=>x.id===m.tid),q=tt.fields.find(f=>f.t==="qty"),r=S.recs[tt.id].find(x=>x._id===m.rid),lopts=S.tpls.filter(x=>(x.gid||"")===(m.to||"")&&x.id!==tt.id),same=lopts.find(x=>nm(x.name)===nm(tt.name)),tl=m.tl||(same?same.id:"");return{tt,q,r,lopts,same,tl}}
const gl=g=>S.tpls.filter(t=>g==="none"?!t.gid:t.gid===g);
const gname=t=>{const g=S.groups.find(x=>x.id===t.gid);return g?g.name+" - ":""};
const aoaOf=t=>[t.fields.map(f=>U(f.n)),...(S.recs[t.id]||[]).map(r=>t.fields.map(f=>U(r[f.id]??"")))];
const PAL=["#3B82F6","#22C55E","#F97316","#EF4444","#A855F7","#EAB308","#EC4899","#94A3B8"];
const gc=g=>(g&&g.color)||"#94A3B8";
function gcard(a,id,name,sub,col){return `<div class="card row" data-a="${a}" data-id="${id}" style="cursor:pointer;border-left:6px solid ${col||"var(--bd)"}"><div class="sp"><b>${h(name)}</b><div class="mu">${sub}</div></div><span>›</span></div>`}
function vInv(){
  if(V.moves)return vMoves();
  if(V.tpl)return vList();
  if(V.grp)return vGrp();
  const un=gl("none");
  return `<h1>Inventarios</h1>`+(S.groups.length||un.length?S.groups.map(g=>gcard("opengrp",g.id,g.name,gl(g.id).length+" listas",gc(g))).join("")+(un.length?gcard("opengrp","none","Sin grupo",un.length+" listas","#94A3B8"):""):`<div class="card mu">Crea un grupo (por ejemplo una sede: CDA, CDB) y dentro metes sus listas: computadoras, teléfonos, consumibles…</div>`)+`<button class="p" data-a="newgrp" style="width:100%">+ Crear grupo (sede)</button>`+(S.tpls.length?`<button data-a="xmulti" style="width:100%;margin-top:10px">⬇ Excel de varias listas</button>`:"")+(S.moves.length?`<button data-a="moves" style="width:100%;margin-top:10px">📦 Movimientos entre sedes (${S.moves.length})</button>`:"");
}
const gnm=id=>id?(S.groups.find(g=>g.id===id)||{name:"Sin grupo"}).name:"Sin grupo";
function vMoves(){return `<div class="row"><button class="s" data-a="back">‹ Volver</button></div><h1>Movimientos entre sedes</h1>`+S.moves.slice().reverse().map(x=>`<div class="card"><b>${x.qty!==""&&x.qty!=null?h(x.qty)+" × ":""}${h(x.list)}</b>${x.item?`<div>${h(x.item)}</div>`:""}<div class="mu">${h(x.from)} → ${h(x.to)} · ${h(x.date)}</div></div>`).join("")}
function vGrp(){
  const none=V.grp==="none",g=S.groups.find(x=>x.id===V.grp);
  if(!none&&!g){V.grp=null;return vInv()}
  const L=gl(V.grp),col=gc(g);
  return `<div class="row"><button class="s" data-a="back">‹ Volver</button><div class="sp"></div>${none?"":`<button class="s" data-a="edgrp">Renombrar / color</button>`}</div><h1><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${col};margin-right:8px"></span>${h(none?"Sin grupo":g.name)}</h1>
  <div class="row" style="margin-bottom:12px"><button class="p sp" data-a="newtpl">+ Nueva lista</button>${L.length?`<button data-a="xlsxg">⬇ Excel del grupo</button>`:""}</div>`+
  (L.length?L.map(t=>gcard("open",t.id,t.name,t.fields.length+" campos · "+(S.recs[t.id]||[]).length+" registros",col)).join(""):`<div class="card mu">Este grupo no tiene listas todavía.</div>`)+
  (none?"":`<div class="row" style="margin-top:14px"><button class="s d" data-a="delgrp">Borrar este grupo</button></div>`);
}

function mergeAll(o){
  let nt=0,nr=0,np=0;
  o.tpls.forEach(t=>{if(!S.tpls.some(x=>x.id===t.id)){S.tpls.push(t);nt++}});
  Object.keys(o.recs||{}).forEach(k=>{const cur=S.recs[k]=S.recs[k]||[];(o.recs[k]||[]).forEach(r=>{if(!cur.some(x=>x._id===r._id)){cur.push(r);nr++}})});
  (o.rtypes||[]).forEach(t=>{if(!S.rtypes.includes(t))S.rtypes.push(t)});(o.groups||[]).forEach(g=>{if(!S.groups.some(x=>x.id===g.id))S.groups.push(g)});(o.presets||[]).forEach(p=>{if(!S.presets.some(x=>x.id===p.id||x.name===p.name))S.presets.push(p)});
  (o.reps||[]).forEach(r=>{if(!S.reps.some(x=>x.id===r.id)){S.reps.push(r);np++}});(o.moves||[]).forEach(x=>{if(!S.moves.some(y=>y.id===x.id))S.moves.push(x)});
  return nt+" listas, "+nr+" registros y "+np+" reportes nuevos";
}
function restoreAll(txt){
  const mode=($("#rmode")||{}).value||"merge";
  try{const o=JSON.parse(txt);if(!o||o.app!=="invrep"||!Array.isArray(o.tpls))throw 0;
    let msg;
    if(mode==="replace"){
      ask("Esto reemplaza TODO lo que hay en este equipo con el respaldo. ¿Continuar?",()=>{S=Object.assign(JSON.parse(JSON.stringify(DEF)),{tpls:o.tpls,recs:o.recs||{},rtypes:o.rtypes||DEF.rtypes,reps:o.reps||[],groups:o.groups||[],presets:o.presets||S.presets,moves:o.moves||[],lastBackup:S.lastBackup,theme:S.theme,upInv:S.upInv,upRep:S.upRep});V.draft.type=S.rtypes[0]||"";save();toast("Respaldo cargado")});render();return;
    }else msg="Agregado: "+mergeAll(o);
    V.draft.type=S.rtypes.includes(V.draft.type)?V.draft.type:(S.rtypes[0]||"");
    if(save()){render();toast(msg)}}
  catch(e){toast("Ese archivo no es un respaldo válido")}
}
document.addEventListener("input",e=>{
  const t=e.target,m=V.modal;
  if(t.dataset.d)V.draft[t.dataset.d]=t.value;
  if(m&&(m.k==="tpl"||m.k==="grp"||m.k==="mv"||m.k==="cf"||m.k==="qty"||m.k==="xsel")){if(t.dataset.m){m[t.dataset.m]=t.value;if(m.k==="mv"&&t.dataset.m==="to"){m.tl="";render()}}if(t.dataset.fi!==undefined){const f=m.fields[t.dataset.fi];f[t.dataset.p]=t.value;if(t.dataset.p==="t")render()}}
});
document.addEventListener("change",async e=>{
  const t=e.target,a=t.dataset.a;
  if(a==="sortf"){const tt=S.tpls.find(x=>x.id===V.tpl);tt.sortF=t.value;save();render();return}
  if(a==="filt"){V.filter=t.value;render();return}
  if(a==="photo"&&t.files.length){for(const f of [...t.files]){if(V.draft.photos.length>=5){toast("Máximo 5 fotos por reporte");break}V.draft.photos.push(await resize(f))}render()}
  if(a==="impfile"&&t.files[0]){importCfg(await t.files[0].text())}
  if(a==="restorefile"&&t.files[0]){restoreAll(await t.files[0].text());t.value=""}
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el||el.tagName==="INPUT"||el.tagName==="SELECT")return;
  const a=el.dataset.a,id=el.dataset.id,m=V.modal,t=S.tpls.find(x=>x.id===V.tpl);
  if(a==="tab"){V.tab=el.dataset.k;V.tpl=null;V.moves=false;V.modal=null}
  else if(a==="open")V.tpl=id;
  else if(a==="cfok"){if(m.word&&String(m.typed||"").trim().toUpperCase()!==m.word){toast("Escribe "+m.word+" para confirmar");return}const f=m.fn;V.modal=null;f()}
  else if(a==="opengrp")V.grp=id;
  else if(a==="back"){if(V.moves)V.moves=false;else if(V.tpl)V.tpl=null;else V.grp=null}
  else if(a==="newtpl")V.modal={k:"tpl",name:"",gid:V.grp==="none"?"":(V.grp||""),fields:[{n:"",t:"text",o:""}]};
  else if(a==="edtpl")V.modal={k:"tpl",id:t.id,name:t.name,gid:t.gid||"",fields:t.fields.map(f=>({...f}))};
  else if(a==="preset"){const P=S.presets.find(x=>x.id===id);m.name=m.name||P.name;m.fields=P.fields.map(f=>({n:f.n,t:f.t,o:f.o||""}))}
  else if(a==="addfield")m.fields.push({n:"",t:"text",o:""});
  else if(a==="delfield")m.fields.splice(+el.dataset.i,1);
  else if(a==="closem")V.modal=null;
  else if(a==="savetpl"){
    const fs=m.fields.filter(f=>f.n.trim()).map(f=>({id:f.id||uid(),n:U(f.n.trim()),t:f.t,o:U(f.o||"")}));
    if(!m.name.trim()||!fs.length){toast("Ponle nombre y al menos un campo");return}
    m.name=U(m.name.trim());
    if(m.pre){const P=S.presets.find(q=>q.id===m.preid);if(P){P.name=m.name.trim();P.fields=fs}else S.presets.push({id:uid(),name:m.name.trim(),fields:fs})}
    else if(m.id){const x=S.tpls.find(q=>q.id===m.id);x.name=m.name.trim();x.fields=fs;x.gid=m.gid||undefined}
    else S.tpls.push({id:uid(),name:m.name.trim(),fields:fs,gid:m.gid||undefined});
    save();V.modal=null}
  else if(a==="deltpl"){ask("¿Borrar la lista y todos sus registros?",()=>{ask("Última verificación: esto no se puede deshacer. Escribe BORRAR para confirmar.",()=>{S.tpls=S.tpls.filter(x=>x.id!==t.id);delete S.recs[t.id];V.tpl=null;save()},"BORRAR")})}
  else if(a==="newrec")V.modal={k:"rec",tid:V.tpl};
  else if(a==="edrec")V.modal={k:"rec",tid:V.tpl,rid:id};
  else if(a==="delrec"){ask("¿Borrar este registro?",()=>{S.recs[t.id]=S.recs[t.id].filter(r=>r._id!==id);save()})}
  else if(a==="saverec"){
    const o={};document.querySelectorAll("[data-rf]").forEach(i=>{const v=i.value.trim();o[i.dataset.rf]=i.type==="number"?v:U(v)});
    const tt=S.tpls.find(x=>x.id===m.tid);S.recs[tt.id]=S.recs[tt.id]||[];
    if(m.rid)Object.assign(S.recs[tt.id].find(r=>r._id===m.rid),o);else S.recs[tt.id].push({_id:uid(),...o});
    save();V.modal=el.dataset.more?{k:"rec",tid:tt.id}:null;if(el.dataset.more)toast("Guardado")}
  else if(a==="xlsx")exportXlsx(t);
  else if(a==="xmulti")V.modal={k:"xsel",sel:{},name:"Inventario"};
  else if(a==="xtog")m.sel[id]=!m.sel[id];
  else if(a==="xgrp"){const L=S.tpls.filter(t=>(t.gid||"")===(id||"")),all=L.every(t=>m.sel[t.id]);L.forEach(t=>m.sel[t.id]=!all)}
  else if(a==="xdo"){const L=S.tpls.filter(t=>m.sel[t.id]);if(!L.length){toast("Marca al menos una lista");return}const multi=new Set(L.map(t=>t.gid||"")).size>1,fn=(m.name||"Inventario").replace(/[\\\/:*?"<>|]/g,"").trim()||"Inventario";xl(L,fn+".xlsx",multi?(t=>gnm(t.gid)+" - "+t.name):null);toast("Preparando Excel…");V.modal=null}
  else if(a==="guide")V.modal={k:"guide"};
  else if(a==="moves")V.moves=true;
  else if(a==="mv")V.modal={k:"mv",tid:V.tpl,rid:id,qty:"",to:t.gid||"",tl:""};
  else if(a==="domove"){
    const {tt,q,r:rec,tl}=mvInfo(m);
    if(!tl){toast("Escoge la lista destino");return}
    let n=1,av=1;
    if(q){av=parseFloat(rec[q.id])||0;n=parseFloat(m.qty);if(!(n>0)){toast("Escribe cuántos pasan");return}if(n>av){toast("Solo hay "+av+" disponibles");return}}
    let dt;
    if(tl==="new"){dt={id:uid(),name:tt.name,gid:m.to||undefined,fields:tt.fields.map(f=>({...f,id:uid()}))};S.tpls.push(dt)}
    else dt=S.tpls.find(x=>x.id===tl);
    let added=0;
    tt.fields.forEach(f=>{if(!dt.fields.some(d=>nm(d.n)===nm(f.n))){dt.fields.push({...f,id:uid()});added++}});
    const pairs=tt.fields.map(f=>[f,dt.fields.find(d=>nm(d.n)===nm(f.n))]);
    S.recs[dt.id]=S.recs[dt.id]||[];
    if(q){
      const dq=pairs.find(p=>p[0]===q)[1],others=pairs.filter(p=>p[0]!==q);
      let dr=S.recs[dt.id].find(x=>others.every(p=>nm(x[p[1].id])===nm(rec[p[0].id])));
      if(dr)dr[dq.id]=String((parseFloat(dr[dq.id])||0)+n);
      else{dr={_id:uid()};others.forEach(p=>dr[p[1].id]=rec[p[0].id]||"");dr[dq.id]=String(n);if(rec._min!=null)dr._min=rec._min;S.recs[dt.id].push(dr)}
      rec[q.id]=String(av-n);
    }else{
      const dr={_id:uid()};pairs.forEach(p=>dr[p[1].id]=rec[p[0].id]||"");S.recs[dt.id].push(dr);
      S.recs[tt.id]=S.recs[tt.id].filter(x=>x._id!==rec._id);
    }
    S.moves.push({id:uid(),date:new Date().toLocaleString("es-VE",{dateStyle:"short",timeStyle:"short"}),from:gnm(tt.gid)+" · "+tt.name,to:gnm(dt.gid)+" · "+dt.name,list:tt.name,item:itemDesc(tt,rec),qty:q?n:""});
    if(save()){V.modal=null;toast("Listo"+(added?" · se agregaron "+added+" campo(s) a la lista destino":""))}}
  else if(a==="fup"){const i=+el.dataset.i;if(i>0){const x=m.fields[i];m.fields[i]=m.fields[i-1];m.fields[i-1]=x}}
  else if(a==="fdn"){const i=+el.dataset.i;if(i<m.fields.length-1){const x=m.fields[i];m.fields[i]=m.fields[i+1];m.fields[i+1]=x}}
  else if(a==="sortd"){t.sortD=t.sortD==="desc"?"asc":"desc";save()}
  else if(a==="qminus"||a==="qplus"){const q=t.fields.find(f=>f.t==="qty"),r=S.recs[t.id].find(x=>x._id===id);r[q.id]=String(Math.max(0,(parseFloat(r[q.id])||0)+(a==="qplus"?1:-1)));save()}
  else if(a==="qset"){const q=t.fields.find(f=>f.t==="qty"),r=S.recs[t.id].find(x=>x._id===id);V.modal={k:"qty",tid:t.id,rid:id,val:String(parseFloat(r[q.id])||0)}}
  else if(a==="qadd"){m.val=String(Math.max(0,(parseFloat(m.val)||0)+(+el.dataset.n)))}
  else if(a==="qsave"){const tt=S.tpls.find(x=>x.id===m.tid),q=tt.fields.find(f=>f.t==="qty"),r=S.recs[tt.id].find(x=>x._id===m.rid),n=parseFloat(m.val);if(isNaN(n)||n<0){toast("Cantidad no válida");return}r[q.id]=String(n);save();V.modal=null}
  else if(a==="tgl"){S[el.dataset.k]=!S[el.dataset.k];save()}
  else if(a==="xlsxg")exportGroup(V.grp);
  else if(a==="newgrp")V.modal={k:"grp",name:"",copy:"",color:PAL[S.groups.length%PAL.length]};
  else if(a==="gcol")m.color=el.dataset.c;
  else if(a==="theme"){S.theme=el.dataset.k;save();applyTheme()}
  else if(a==="edgrp")V.modal={k:"grp",id:V.grp,name:S.groups.find(x=>x.id===V.grp).name,color:gc(S.groups.find(x=>x.id===V.grp))};
  else if(a==="savegrp"){
    if(!m.name.trim()){toast("Ponle un nombre al grupo");return}m.name=U(m.name.trim());
    if(m.id){const G=S.groups.find(x=>x.id===m.id);G.name=m.name.trim();G.color=m.color}
    else{const g={id:uid(),name:m.name.trim(),color:m.color};S.groups.push(g);
      if(m.copy)S.tpls.filter(x=>x.gid===m.copy).forEach(x=>S.tpls.push({id:uid(),name:x.name,gid:g.id,fields:x.fields.map(f=>({...f,id:uid()}))}));
      V.grp=g.id}
    save();V.modal=null}
  else if(a==="delgrp"){ask("¿Borrar este grupo con todas sus listas y registros?",()=>{ask("Última verificación: esto no se puede deshacer. Escribe BORRAR para confirmar.",()=>{S.tpls.filter(x=>x.gid===V.grp).forEach(x=>delete S.recs[x.id]);S.tpls=S.tpls.filter(x=>x.gid!==V.grp);S.groups=S.groups.filter(x=>x.id!==V.grp);V.grp=null;save()},"BORRAR")})}
  else if(a==="newpre")V.modal={k:"tpl",pre:1,name:"",fields:[{n:"",t:"text",o:""}]};
  else if(a==="edpre"){const P=S.presets.find(x=>x.id===id);V.modal={k:"tpl",pre:1,preid:id,name:P.name,fields:P.fields.map(f=>({...f}))}}
  else if(a==="delpre"){ask("¿Borrar este atajo? Las listas ya creadas no se afectan.",()=>{S.presets=S.presets.filter(x=>x.id!==m.preid);V.modal=null;save()})}
  else if(a==="topreset"){
    const fs=m.fields.filter(f=>f.n.trim()).map(f=>({n:f.n.trim(),t:f.t,o:f.o||""}));
    if(!m.name.trim()||!fs.length){toast("Ponle nombre y al menos un campo");return}
    S.presets.push({id:uid(),name:m.name.trim(),fields:fs});save();toast("Atajo guardado");return}
  else if(a==="share"){const r=curRep();if(!r.desc&&!r.photos.length){toast("Agrega foto o descripción");return}shareRep(r);return}
  else if(a==="copy"){const r=curRep();if(!r.desc){toast("Falta la descripción");return}copyText(repText(r));return}
  else if(a==="saverep"){const r=curRep();if(!r.desc&&!r.photos.length){toast("Agrega foto o descripción");return}S.reps.push(r);if(save()){V.draft={type:r.type,photos:[],desc:"",equipo:""};toast("Guardado en el historial")}else S.reps.pop()}
  else if(a==="clrdraft")V.draft={type:V.draft.type,photos:[],desc:"",equipo:""};
  else if(a==="cam"){$("#fcam").click();return}
  else if(a==="gal"){$("#fgal").click();return}
  else if(a==="rmph")V.draft.photos.splice(+el.dataset.i,1);
  else if(a==="delph"){
    const days=+$("#pdays").value,cut=Date.now()-days*864e5;
    ask("¿Borrar las fotos de reportes con más de "+days+" días? El texto de los reportes se queda.",()=>{let n=0;S.reps.forEach(r=>{const t=repTime(r);if(t&&t<cut&&ph(r).length){n+=ph(r).length;r.fotosBorradas=(r.fotosBorradas||0)+ph(r).length;r.photos=[];delete r.photo}});save();toast(n+" foto(s) borrada(s)")})}
  else if(a==="delphall"){ask("¿Borrar TODAS las fotos de los reportes? El texto se queda.",()=>{let n=0;S.reps.forEach(r=>{if(ph(r).length){n+=ph(r).length;r.fotosBorradas=(r.fotosBorradas||0)+ph(r).length;r.photos=[];delete r.photo}});save();toast(n+" foto(s) borrada(s)")})}
  else if(a==="resend"){shareRep(S.reps.find(r=>r.id===id));return}
  else if(a==="delrep"){S.reps=S.reps.filter(r=>r.id!==id);save()}
  else if(a==="addtype"){const v=$("#nt").value.trim();if(v&&!S.rtypes.includes(v)){S.rtypes.push(v);save()}}
  else if(a==="deltype"){S.rtypes.splice(+el.dataset.i,1);save()}
  else if(a==="expcfg"){dl("plantillas.json",new Blob([JSON.stringify(cfgObj(),null,1)],{type:"application/json"}));return}
  else if(a==="copycfg"){copyText(JSON.stringify(cfgObj()),"Código copiado; pégalo en el otro equipo");return}
  else if(a==="impTxt"){importCfg($("#imp").value);return}
  else if(a==="expall")doBackup(true);
  else if(a==="expnp"||a==="bkp")doBackup(false);
  else if(a==="snooze"){S.snooze=ymd();save()}
  render();
});
if(!S.rtypes.includes(V.draft.type))V.draft.type=S.rtypes[0]||"";
$("#ver").textContent="v"+VERSION;applyTheme();
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script></body></html>
